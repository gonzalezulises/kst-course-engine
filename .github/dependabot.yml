version: 2

# `enable-beta-ecosystems: true` por el ecosistema uv. El valor `uv` es GA en la
# referencia de opciones de Dependabot, pero en helm el flag se retiro al pasar a GA y el
# updater siguio fallando sin el por una comprobacion embebida
# (dependabot/dependabot-core#12121). Dejarlo es la direccion segura: inocuo si no hace
# falta, imprescindible si esa comprobacion existe. Solo afecta a los ecosistemas
# declarados aqui.
enable-beta-ecosystems: true

# Este repo no tenia .github/dependabot.yml, asi que solo recibia actualizaciones de
# seguridad: una por vulnerabilidad, sin agrupar y sin nada que las cerrara.
#
# Dos ecosistemas, y ninguno en la raiz para npm: npm solo en /docs, y uv en la raiz
# (pyproject.toml + uv.lock). Los cinco PRs abiertos de `dependabot/uv/...` salian de ahi.
#
# `applies-to: security-updates` las colapsa en un PR por tanda y por ecosistema. El
# `cooldown` no aplica a las de seguridad. `open-pull-requests-limit: 0` apaga las de
# version: sin un check requerido que construya el proyecto, un bump no tendria quien lo
# verifique y la cola volveria a llenarse.
updates:
  - package-ecosystem: npm
    directory: "/docs"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns:
          - "*"
